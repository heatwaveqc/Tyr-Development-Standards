name: Lifecycle audit
on:
  schedule:
    - cron: '25 15 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  audit:
    uses: heatwaveqc/Tyr-Development-Standards/.github/workflows/lifecycle-audit.yml@REPLACE_WITH_REVIEWED_FULL_SHA
    with:
      mode: ${{ github.event_name == 'pull_request' && 'collision' || 'inventory' }}
      pr-number: ${{ github.event.pull_request.number || 0 }}
      branch-budget: 20
      permanent-branches: ''
      protected-donors: ''
