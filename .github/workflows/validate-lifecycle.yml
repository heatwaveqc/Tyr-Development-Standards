name: Shared lifecycle validation
on:
  pull_request:
    paths:
      - '.github/workflows/lifecycle-audit.yml'
      - '.github/workflows/validate-lifecycle.yml'
      - 'tests/test_lifecycle.py'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
  live-inventory:
    uses: ./.github/workflows/lifecycle-audit.yml
    with:
      mode: inventory
  live-collision:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/lifecycle-audit.yml
    with:
      mode: collision
      pr-number: ${{ github.event.pull_request.number }}
